name: Diagnostica accesso siti (temporaneo)

on:
  workflow_dispatch: {}

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica accesso a vari URL
        run: |
          check() {
            url="$1"
            echo "=================================================="
            echo "URL: $url"
            code=$(curl -s -o /tmp/body.html -D /tmp/headers.txt -w "%{http_code}" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: it-IT,it;q=0.9,en;q=0.8" \
              --max-time 20 "$url" || echo "CURL_ERROR")
            echo "HTTP status: $code"
            echo "--- Response headers ---"
            cat /tmp/headers.txt 2>/dev/null | head -30
            echo "--- Body (primi 500 caratteri) ---"
            head -c 500 /tmp/body.html 2>/dev/null
            echo ""
            echo ""
          }
          check "https://www.odeonline.it/robots.txt"
          check "https://www.odeonline.it/"
          check "https://www.odeonline.it/programmazione/"
          check "https://www.mymovies.it/cinema/vicenza/"
          check "https://www.comingsoon.it/cinema/vicenza/odeon/"
