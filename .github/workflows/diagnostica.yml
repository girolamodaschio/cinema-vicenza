name: Diagnostica struttura siti (temporaneo)

on:
  workflow_dispatch: {}

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Approfondimento Spazio Roma (iframe/widget esterni)
        run: |
          curl -sL -o /tmp/roma.html \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.8" \
            --max-time 20 "https://spazio-roma.it/cinema/"
          echo "Dimensione: $(wc -c < /tmp/roma.html) bytes"
          echo "--- iframe presenti ---"
          grep -oE '<iframe[^>]*>' /tmp/roma.html
          echo "--- script src esterni (dominio diverso) ---"
          grep -oE '<script[^>]*src="[^"]*"' /tmp/roma.html | grep -viE 'spazio-roma\.it|wp-(includes|content|json)|jquery|elementor' | head -30
          echo "--- link a domini esterni di booking/ticketing ---"
          grep -oE 'https?://[a-zA-Z0-9.-]+\.[a-z]{2,}[^"'"'"' ]*' /tmp/roma.html | grep -viE 'spazio-roma\.it|w3\.org|gmpg\.org|iubenda|facebook\.com|instagram\.com|google|gstatic|fonts\.' | sort -u | head -40
          echo "--- contesto intorno a 'Programmazione' (300 caratteri dopo) ---"
          python3 - <<'EOF'
          data = open('/tmp/roma.html', encoding='utf-8', errors='replace').read()
          idx = data.find('elementor-heading-title elementor-size-default">Programmazione')
          if idx == -1:
              idx = data.find('>Programmazione<')
          print(data[idx:idx+3000] if idx != -1 else "NON TROVATO")
          EOF

      - name: Approfondimento Araceli (contesto date/orari)
        run: |
          curl -sL -o /tmp/araceli.html \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.8" \
            --max-time 20 "https://www.araceli.it/cinema/"
          echo "Dimensione: $(wc -c < /tmp/araceli.html) bytes"
          echo "--- contesto attorno a 21:00 (prima occorrenza, 2000 caratteri prima e dopo) ---"
          python3 - <<'EOF'
          data = open('/tmp/araceli.html', encoding='utf-8', errors='replace').read()
          idx = data.find('21:00')
          start = max(0, idx-2000)
          print(data[start:idx+500] if idx != -1 else "NON TROVATO")
          EOF
          echo "--- intera sezione body per ispezione (bytes 0-8000) ---"
          head -c 8000 /tmp/araceli.html | tail -c 6000
