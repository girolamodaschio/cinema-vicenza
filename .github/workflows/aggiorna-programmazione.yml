name: Aggiorna programmazione Odeon Vicenza

on:
  schedule:
    # Ogni giovedì alle 06:00 UTC (~08:00 ora italiana in inverno, 07:00 in estate legale),
    # giorno in cui l'Odeon aggiorna la programmazione settimanale
    - cron: '0 6 * * 4'
  workflow_dispatch: {}   # permette anche l'avvio manuale da GitHub

permissions:
  contents: write   # necessario per fare il commit/push dei file generati

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Genera programmazione settimanale (JSON + HTML)
        run: >
          go run programmazione_odeon.go -settimana
          -out docs/programmazione.json
          -html docs/index.html

      - name: Commit e push (solo se ci sono modifiche)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/programmazione.json docs/index.html
          git diff --staged --quiet || git commit -m "Aggiorna programmazione $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
