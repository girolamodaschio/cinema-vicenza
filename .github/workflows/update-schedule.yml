name: Update Odeon Vicenza schedule

on:
  schedule:
    # Every Thursday at 06:00 UTC (~08:00 Italian time in winter, 07:00 in
    # summer/DST), the day the Odeon updates its weekly schedule
    - cron: '0 6 * * 4'
  workflow_dispatch: {}   # also allows manual runs from GitHub

permissions:
  contents: write   # needed to commit/push the generated files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate weekly schedule (JSON + HTML)
        run: >
          go run main.go -week
          -out docs/programmazione.json
          -html docs/index.html

      - name: Commit and push (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/programmazione.json docs/index.html docs/robots.txt docs/sitemap.xml
          git diff --staged --quiet || git commit -m "Update schedule $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
